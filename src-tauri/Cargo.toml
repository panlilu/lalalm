[package]
name = "lalalm"
version = "0.2.1"
description = "LalaLM — local LLM model center & downloader"
authors = ["LalaLM"]
edition = "2021"
rust-version = "1.77"
default-run = "lalalm"

[[bin]]
name = "lalalm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }
tokio = { version = "1", features = [
  "process",
  "time",
  "sync",
  "macros",
  "io-util",
  "rt-multi-thread",
] }
sysinfo = "0.33"
dirs = "6"
once_cell = "1"
regex = "1"
rand = "0.8"
trash = "3"

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
