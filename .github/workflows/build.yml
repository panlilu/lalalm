name: build

# Build release bundles for macOS (Apple Silicon) and Windows (x64 NSIS).
# Trigger manually, or by pushing a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch aria2c sidecar
        run: bash scripts/fetch-aria2.sh

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build app + dmg
        run: pnpm tauri build --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: LalaLM-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch aria2c sidecar (Windows)
        shell: bash
        run: bash scripts/fetch-aria2.sh

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: LalaLM-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
